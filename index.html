        <h1>Siddharth Gupta: Full-stack developer (React, .NET), Noida, India</h1>
        <p>I’m a full-stack developer in Noida working in fintech and automotive. I like a messy business problem: I reduce it to rules anyone can check, then build the React and .NET application that carries them out. I’ve shipped since 2020 and led offshore teams as a senior engineer.</p>
        <h2>How I can help</h2>
        <p><strong>Full-stack web applications.</strong> React 18 front ends on a .NET 8 Web API with EF Core and SQL, taken from requirements through testing and deployment.</p>
<p><strong>APIs and integrations.</strong> REST and SOAP services, secured with JWT, OAuth 2.0 and SSO. Early in my career I built the GST, e-invoice and e-way bill APIs that filing apps depend on.</p>
<p><strong>Database and performance work.</strong> Stored procedures, triggers, views, indexes and query optimization, with monitoring to catch slow queries before users do.</p>
<p><strong>Older .NET codebases.</strong> I’ve worked in Web Forms, WCF and ADO.NET as well as .NET 8, so I’m comfortable maintaining or migrating systems built across .NET 3.5 to .NET 8.</p>
<p><strong>Delivery leadership.</strong> Coordinating teams, writing functional and technical documents, and planning releases so work lands on the dates promised, and staying close to clients and users with support.</p>

<li><h3>Senior Engineer, Redmil Business Mall (Dec 2021 – Apr 2023)</h3><ul><li>Built the Web API behind RBM Android App and maintained its SQL database, serving more than 500,000 users and over 5 lakh API hits a day on average with accurate data.</li><li>Kept the API fast and the data correct with database indexes, caching and checks against duplicate payments.</li><li>Coordinated offshore application teams and guided them through every phase of each project.</li><li>Kept a daily query-tracking sheet so the client and the offshore team always knew which issues were open.</li><li>Wrote the functional and high-level technical documents, and mapped implementation dates each week so releases never collided with other activities.</li></ul><ul><li><strong>RBM Android App</strong>: Web API 2.0, SQL. A B2B fintech Android app offering BBPS bill payments, IRCTC rail booking, AePS (Aadhaar-enabled payments), loans and credit card applications. Used by more than 5 lakh (500,000) people, with more than 5 lakh (500,000) API hits and ₹10+ crore handled every day on average. I built the Web API behind the app and maintained its SQL database, keeping the data accurate under that load.</li><li><strong>RBM Admin Panel</strong>: Web Forms, Web API 2.0, ADO.NET, SQL. The admin panel for the RBM Android App. Internal teams such as accounts, business and support use it to manage the overall functions of the app.</li></ul></li>
